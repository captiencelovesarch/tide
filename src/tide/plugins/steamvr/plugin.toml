[plugin]
slug        = "steamvr"
name        = "steamvr"
description = "check the watch on your wrist and tide opens in vr. look away and it goes."
version     = "0.3.0"
api         = 1
entry       = "plugin:SteamVr"
# pyopenvr. on arch: the python-openvr package
requires    = ["openvr"]
uses        = ["playback", "queue", "lyrics", "vr", "ui"]
default     = false

[[setting]]
key     = "watch_hand"
label   = "watch on"
kind    = "choice"
choices = [["left", "left wrist"], ["right", "right wrist"]]
default = "left"
tooltip = "turn that wrist toward your face to see the watch. poke it with your other index finger."

[[setting]]
key     = "open_by_looking"
label   = "open by looking"
kind    = "bool"
default = true
tooltip = "keep looking at the watch for a second and the panel opens. it swells as you look."

[[setting]]
key     = "touch"
label   = "touch"
kind    = "bool"
default = true
tooltip = "press the panel with the tip of your controller. off: the laser only."

[[setting]]
key     = "toast"
label   = "now playing toast"
kind    = "choice"
choices = [["off", "off"], ["follow", "follows you"], ["stay", "stays put"]]
default = "off"
tooltip = "a few seconds of the new song when it changes, a little under where you're looking. follows you: it trails your view. stays put: it stays where it came up."

[[setting]]
key     = "size"
label   = "panel size"
kind    = "choice"
choices = [["small", "small"], ["medium", "medium"], ["large", "large"]]
default = "medium"

[[setting]]
key     = "linger"
label   = "goes away after"
kind    = "choice"
choices = [[1.5, "1.5 s of looking away"], [2.5, "2.5 s of looking away"], [4.0, "4 s of looking away"], [6.0, "6 s of looking away"]]
default = 2.5

[[setting]]
key     = "ring"
label   = "ring"
kind    = "choice"
choices = [["off", "off"], ["kick", "on the kick"], ["breathing", "breathing"]]
default = "off"
tooltip = "a glow on the edge of your view that pulses with the music. never more than three flashes a second. needs motion on."

[[setting]]
key     = "ring_strength"
label   = "ring strength"
kind    = "choice"
choices = [["subtle", "subtle"], ["normal", "normal"], ["loud", "loud"]]
default = "normal"

[[setting]]
key     = "panel_glow"
label   = "panel glow"
kind    = "choice"
choices = [["off", "off"], ["kick", "on the kick"], ["breathing", "breathing"]]
default = "kick"
tooltip = "the panel's edge glows with the music, in the cover's colours. same flash limit as the ring. needs motion on."

[[setting]]
key     = "lyrics"
label   = "lyrics"
kind    = "bool"
default = true
tooltip = "the line before, the one being sung and the next one, under the title."

[[setting]]
key     = "haptics"
label   = "haptics"
kind    = "bool"
default = true
tooltip = "a tick in your hands when the panel opens and closes."

[[setting]]
key     = "voice_model"
label   = "get the voice model"
kind    = "action"
tooltip = "whisper, about 77 mb, runs on this computer. voice search needs it."
