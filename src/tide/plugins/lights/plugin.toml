[plugin]
slug        = "lights"
name        = "lights"
description = "your rgb lights pulse with the bass in the cover's colours. openrgb and wled."
version     = "0.1.0"
api         = 1
entry       = "plugin:Lights"
uses        = ["playback", "network"]
default     = false

[[setting]]
key     = "mode"
label   = "pulse"
kind    = "choice"
choices = [["kick", "on the kick"], ["breathing", "breathing"]]
default = "kick"
tooltip = "never more than three flashes a second. a faster beat still shows, just softer."

[[setting]]
key     = "strength"
label   = "brightness"
kind    = "choice"
choices = [["subtle", "subtle"], ["normal", "normal"], ["loud", "loud"]]
default = "normal"

[[setting]]
key     = "colours"
label   = "colours"
kind    = "choice"
choices = [["cover", "from the cover"], ["accent", "the theme's accent"]]
default = "cover"

[[setting]]
key     = "paused"
label   = "when paused"
kind    = "choice"
choices = [["dim", "glow dimly"], ["off", "go dark"]]
default = "dim"

[[setting]]
key     = "openrgb"
label   = "openrgb"
kind    = "bool"
default = true
tooltip = "pc rgb through openrgb: keyboards, mice, ram, the motherboard and what's plugged into it. your lights get their old colours back when tide lets go."

[[setting]]
key     = "start_openrgb"
label   = "start openrgb for me"
kind    = "bool"
default = true
tooltip = "if openrgb isn't running, tide starts its server in the background (no window) and stops it again when you switch lights off."

[[setting]]
key     = "size_headers"
label   = "set up empty rgb headers"
kind    = "bool"
default = true
tooltip = "a motherboard's addressable rgb headers start at 0 leds in openrgb, so a cooler or fans on them stay dark. tide gives an empty one 24 (extra ones are harmless). openrgb remembers it."

[[setting]]
key     = "openrgb_address"
label   = "openrgb at"
kind    = "str"
default = "127.0.0.1:6742"

[[setting]]
key     = "wled"
label   = "wled"
kind    = "str"
default = ""
tooltip = "the address of each wled strip, comma separated (192.168.1.40, wled-desk.local). they go back to their own effect two seconds after tide stops."

[[setting]]
key     = "test"
label   = "flash them once"
kind    = "action"
tooltip = "a quick sweep through the colours, to see what's connected."
