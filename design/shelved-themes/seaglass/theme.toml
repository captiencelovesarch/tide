# Palette sampled from the reference mockup the theme is an homage to:
# smoked slate-teal glass, one amber + one lime accent, generous rounding.
# The #AARRGGBB backgrounds plus [layout] window_translucent make the
# window genuinely see-through; KWin users can add a blur rule (or the
# kwin-effects-forceblur AUR package) for the full frosted look.

[meta]
name     = "seaglass"
slug     = "seaglass"
author   = "tide"
version  = 1
dark     = true
aesthetic= "modern"

[tokens]
bg        = "#c7142029"
bg_alt    = "#d41a2f38"
fg        = "#ecf2ef"
dim       = "#7a9598"
accent    = "#f0b848"
accent_alt= "#a0e838"
sel_bg    = "#f0b848"
sel_fg    = "#142029"
hover_bg  = "#d62a4350"
hover_fg  = "#f4f8f6"
border_col= "#4a6a72"
border_dim= "#802a3f48"

[typography]
family  = "Inter"
size_pt = 10
weight  = 400
case    = "normal"
mono    = false

[layout]
radius_px         = 12
border_px         = 1
spacing_px        = 12
ambient_art       = true
window_translucent= true
control_style     = "glyph"
list_marker       = "  "
visualizer        = "waveform-envelope"

[slots]
progress = "bar"
volume   = "knob"
album_art= "square"
controls = "large"
now_label= "stacked"
