name: windows build

# Builds tide-setup.exe. Runs by hand from the Actions tab, and whenever a
# release is published, where the installer goes onto that release. The
# Windows build's updater looks for it there, so every release needs one.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install . "yt-dlp[default]" watchdog PyYAML pyinstaller pillow

      - name: Version
        id: version
        shell: bash
        run: echo "version=$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"

      - name: Fetch mpv, ffmpeg, deno
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./windows/fetch-bin.ps1

      - name: Icon
        run: python windows/make_ico.py

      - name: PyInstaller
        run: pyinstaller --noconfirm --distpath build/windows/dist --workpath build/windows/work windows/tide.spec

      - name: Inno Setup
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe" "/DAppVersion=${{ steps.version.outputs.version }}" windows\tide.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Install the way a person would (silently here), then run the
      # installed copy's self test: imports, libmpv, bundled data, tools.
      - name: Install and self test
        run: |
          $p = Start-Process build\windows\installer\tide-setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited $($p.ExitCode)" }
          $exe = "$env:LOCALAPPDATA\Programs\tide\tide.exe"
          $t = Start-Process $exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\tide\cache\tide.log"
          if ($t.ExitCode -ne 0) { throw "self test failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: tide-setup-${{ steps.version.outputs.version }}
          path: build/windows/installer/tide-setup.exe

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "${{ github.event.release.tag_name }}" build/windows/installer/tide-setup.exe --clobber
